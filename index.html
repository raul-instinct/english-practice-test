<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אימון אנגלית - שלוש רמות בסגנון אמירנט</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f2933;--mute:#5f6b76;--line:#e2dccf;--acc:#0f6b64;--acc2:#e8f2f0;--ok:#1f7a4a;--okbg:#e3f3e9;--bad:#b3362b;--badbg:#fbe9e6;--warn:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.45rem;line-height:1.25;margin:6px 0 8px}
h2{font-size:1.15rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.note{background:var(--warn);border:1px solid #ead9a0;border-radius:12px;padding:10px 12px;font-size:.95rem}
.en{direction:ltr;text-align:left;unicode-bidi:isolate;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;overflow-wrap:anywhere}
.passage{background:#fbf8ef;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px;max-height:none}
.passage p{margin:0 0 .7em}.passage p:last-child{margin:0}
.ptitle{font-weight:700;font-family:system-ui,sans-serif;margin-bottom:6px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:46px}
.btn.sec{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.row .btn{flex:1}
.opt{display:flex;gap:10px;width:100%;direction:ltr;text-align:left;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;color:var(--ink);font-family:Georgia,serif;font-size:1.02rem;line-height:1.4;overflow-wrap:anywhere}
.opt b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font:700 .8rem system-ui}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.sel b{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.88rem}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:.82rem;margin-inline-end:6px}
.q{font-weight:600;margin:0 0 6px}
.big{font-size:2.6rem;font-weight:800;color:var(--acc);line-height:1.1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--acc)}
.sec-line{display:flex;justify-content:space-between;gap:8px;font-size:.98rem}
.prac{border-inline-start:4px solid var(--acc);padding:6px 10px;margin:10px 0;background:#fff;border-radius:8px}
.prac small{color:var(--mute);display:block}
.rev{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.why{background:var(--acc2);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.95rem}
.tag-ok{color:var(--ok);font-weight:700}.tag-bad{color:var(--bad);font-weight:700}
.hide{display:none}
.foot{color:var(--mute);font-size:.85rem;margin-top:22px;text-align:center}
bdi{white-space:nowrap}
ul.clean{padding-inline-start:20px;margin:6px 0}
.levels{display:grid;gap:9px;margin:12px 0}.level{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:right;color:var(--ink);min-height:64px}.level.selected{border-color:var(--acc);background:var(--acc2)}.level strong{font-weight:700}.level small{display:block;color:var(--mute);margin-top:4px}.level bdi{font-size:.9rem;margin-inline-start:8px}.section-en{display:block;direction:ltr;text-align:right;color:var(--mute);font-size:.85rem}button:focus-visible{outline:3px solid #aa6500;outline-offset:3px}.meta{gap:8px;flex-wrap:wrap}.opt span{min-width:0}.row{flex-wrap:wrap}.row .btn{min-width:120px}bdi{white-space:normal}</style>
</head>

var SECTIONS=[
{id:"sc",name:"השלמת משפטים",en:"Sentence Completion",intro:"בחרו את המילה או הצירוף שמשלימים את המשפט נכון.",qs:[
{q:"The manager was ___ with the results, so she decided to give everyone a bonus.",o:["satisfied","curious","nervous","careless"],t:"אוצר מילים",w:"satisfied = מרוצה. מתנה לכולם מתאימה למנהלת מרוצה."},
{q:"If I ___ more time, I would learn to play the piano.",o:["had","have","will have","having"],t:"משפטי תנאי",w:"תנאי דמיוני (משהו שלא קורה עכשיו): If + past simple, would + verb."},
{q:"She didn't go to the party ___ she was feeling tired.",o:["because","although","unless","while"],t:"מילות קישור",w:"because = כי. המשפט השני הוא הסיבה לכך שלא הלכה."},
{q:"The new law will ___ the amount of plastic used in stores.",o:["reduce","produce","prefer","protect"],t:"אוצר מילים",w:"reduce = להפחית. שימו לב להבדל מ-produce (לייצר)."},
{q:"He is the only one of my friends ___ lives abroad.",o:["who","whom","whose","which"],t:"כינויי קישור",w:"who משמש לאנשים כנושא המשפט (הוא גר). whose = של מי, whom = אובייקט."},
{q:"By the time we arrived, the movie ___ already started.",o:["had","has","was","is"],t:"זמנים",w:"By the time + עבר פשוט, מה שקרה קודם הוא past perfect: had + פועל בצורה השלישית."},
{q:"Scientists are trying to find a ___ for the disease, but so far nothing has worked.",o:["cure","crowd","cost","coast"],t:"אוצר מילים",w:"cure = תרופה, ריפוי. שאר המילים נשמעות דומה אבל משמעותן אחרת."},
{q:"___ the heavy rain, the match was not cancelled.",o:["Despite","Because of","Unless","Since"],t:"מילות קישור",w:"Despite = למרות, ואחריה שם עצם the heavy rain. הניגוד: גשם חזק אבל המשחק התקיים."},
{q:"My brother is much ___ than I am; he can lift almost anything.",o:["stronger","strongest","more strong","strong"],t:"מדרגות השוואה",w:"מילה קצרה + than = סיומת er stronger. strongest מתאים להשוואה בין שלושה ומעלה."},
{q:"The teacher asked the students to ___ their essays before handing them in.",o:["revise","rescue","reject","resist"],t:"אוצר מילים",w:"revise = לתקן ולשפר טקסט. rescue = להציל, reject = לדחות, resist = להתנגד."}
]},
{id:"rs",name:"ניסוח מחדש",en:"Restatement",intro:"בחרו את המשפט שמשמעותו הקרובה ביותר למשפט המקורי.",qs:[
{q:"Although the exam was difficult, most students passed it.",o:["Most students passed the exam even though it was difficult.","The exam was difficult because most students passed it.","Most students failed because the exam was difficult.","The exam was easy, so most students passed it."],t:"מילות קישור",w:"Although = even though = למרות ש. יש ניגוד: קשה, ובכל זאת עברו."},
{q:"I wish I had studied more for the test.",o:["I regret not studying more for the test.","I studied a lot for the test.","I will study more for the test.","I am studying for the test now."],t:"משפטי תנאי ו-wish",w:"wish + past perfect = חרטה על משהו שקרה בעבר לא למדתי מספיק."},
{q:"Unless you hurry, you will miss the bus.",o:["If you don't hurry, you will miss the bus.","If you hurry, you will miss the bus.","You will miss the bus because you hurried.","Hurrying will make you miss the bus."],t:"משפטי תנאי ו-wish",w:"Unless = if ... not. אם לא תמהר, תפספס את האוטובוס."},
{q:"The report was written by the new employee.",o:["The new employee wrote the report.","The new employee will write the report.","The report wrote about the new employee.","The new employee was reading the report."],t:"סביל",w:"was written by הוא סביל בעבר. בפעיל, new employee הוא הנושא ו-wrote הוא הפועל."},
{q:"She said to me, \"I will call you tomorrow.\"",o:["She told me that she would call me the next day.","She told me that she had called me the day before.","She asked me to call her the next day.","She told me that I would call her tomorrow."],t:"דיבור עקיף",w:"בדיבור עקיף will הופך ל-would, ו-tomorrow הופך ל-the next day. מי שמתקשר הוא היא."},
{q:"He is too tired to drive.",o:["He is so tired that he can't drive.","He is tired enough to drive.","He is not tired, so he can drive.","He drives because he is tired."],t:"מבנים מיוחדים",w:"too + תואר + to = יותר מדי כדי ש... כלומר הוא לא יכול לנהוג."},
{q:"Not only did the company lose money, but it also lost its best workers.",o:["The company lost both money and its best workers.","The company lost money but kept its best workers.","The company lost its best workers because it lost money.","The company lost only money."],t:"מבנים מיוחדים",w:"Not only ... but also = לא רק ... אלא גם. שני הדברים קרו."},
{q:"Hardly anyone came to the meeting.",o:["Very few people came to the meeting.","Almost everyone came to the meeting.","Nobody came to the meeting.","Many people came to the meeting."],t:"כמתים ושלילה",w:"hardly anyone = כמעט אף אחד = מעט מאוד אנשים. Nobody חזק יותר: ממש אף אחד."}
]},
{id:"rc",name:"הבנת הנקרא",en:"Reading Comprehension",intro:"קראו כל קטע ועברו לשאלות. חזרו לטקסט כמה פעמים שתרצו.",passages:[
{title:"Sleep and Teenagers",text:["Many teenagers do not get enough sleep. Doctors say that people between the ages of 13 and 18 need about nine hours of sleep each night, but studies show that most teenagers sleep for only six or seven hours. One reason is biological. During the teenage years, the body clock changes, and young people begin to feel tired later in the evening. Another reason is technology. Many teenagers use their phones until late at night, and the bright light from the screen makes it harder for the brain to relax.","The results of too little sleep can be serious. Students who are tired find it difficult to concentrate in class, and they often forget what they have learned. Some schools have therefore decided to start the school day an hour later. In one town where this change was made, test scores went up and fewer students were late. Experts also suggest that teenagers turn off their phones at least an hour before bed."],
qs:[
{q:"What is the main idea of the text?",o:["Teenagers often sleep too little, and there are reasons and results.","Phones are the only reason teenagers feel tired.","Schools should stop giving tests to teenagers.","Teenagers need less sleep than adults."],t:"רעיון מרכזי",w:"הטקסט מדבר על חוסר שינה, על הסיבות לו ועל ההשלכות. תשובות אחרות מקטינות או הופכות את הנאמר."},
{q:"According to the text, why do teenagers feel tired later in the evening?",o:["Their body clock changes as they grow.","They drink too much coffee.","They have a lot of homework.","They go to school too early."],t:"פרט בטקסט",w:"כתוב במפורש: During the teenage years, the body clock changes."},
{q:"What happened in the town that started school later?",o:["Test scores rose and fewer students were late.","Students slept for nine hours every night.","Teachers started to give more homework.","Students stopped using their phones."],t:"פרט בטקסט",w:"המשפט: test scores went up and fewer students were late."},
{q:"The word \"concentrate\" paragraph 2 is closest in meaning to:",o:["focus","relax","argue","travel"],t:"מילה בהקשר",w:"קשה לתלמידים עייפים to concentrate in class = להתמקד, להתרכז. focus הוא המילה הקרובה."}
]},
{title:"A Library of Things",text:["In some cities, you can now borrow more than books from the library. A \"library of things\" lets people borrow tools, cameras, camping equipment, and even musical instruments for a small fee or for free. The idea began when people realized that many of us buy things we use only a few times. A drill, for example, is used for just a few minutes in its whole life, yet millions of families own one.","Supporters say that the idea saves money and is good for the environment, since fewer products need to be made. It also helps neighbors meet each other. However, there are some problems. Items can break or get lost, and volunteers must spend time repairing them. Some critics also worry that people will not take good care of things that do not belong to them. Despite these worries, new libraries of things open every year, and many of them are very popular."],
qs:[
{q:"Why did the idea of a library of things begin?",o:["People noticed that they own things they rarely use.","Books became too expensive for most people.","Cities wanted to sell more tools.","Volunteers needed a place to work."],t:"פרט בטקסט",w:"הרעיון התחיל כשהבינו שאנשים קונים דברים שמשתמשים בהם רק כמה פעמים."},
{q:"Which of these is NOT mentioned as a benefit?",o:["The borrowed items last longer.","People save money.","It is good for the environment.","Neighbors get to know each other."],t:"פרט בטקסט",w:"בשאלות NOT מחפשים את הדבר היחיד שלא מופיע. שלושת הדברים האחרים מוזכרים בפסקה השנייה."},
{q:"What can we understand from the last sentence of the text?",o:["Libraries of things are becoming more common in spite of the problems.","Libraries of things are closing because of the problems.","Nobody wants to use libraries of things.","The problems have already been solved."],t:"הסקה",w:"Despite these worries = למרות החששות. ועדיין נפתחות עוד ספריות מדי שנה ורבות פופולריות."},
{q:"The word \"critics\" refers to people who:",o:["have doubts about the idea.","repair broken items.","borrow the most items.","work at the library."],t:"מילה בהקשר",w:"critics = מבקרים. בהקשר: אנשים שמודאגים ומצביעים על חסרונות."}
]}
]}
];
var LEVEL_DATA={"basic": [{"id": "sc", "name": "השלמת משפטים", "en": "Sentence Completion", "intro": "בחרו את המילה או הצירוף שמשלימים את המשפט נכון.", "qs": [{"q": "Please ___ the window; it is cold in here.", "o": ["close", "count", "carry", "choose"], "t": "אוצר מילים", "w": "close = לסגור. כשקר בחדר, מבקשים לסגור את החלון."}, {"q": "Sara usually ___ to work by bus.", "o": ["goes", "go", "going", "gone"], "t": "זמנים", "w": "בהרגל קבוע משתמשים בהווה פשוט. עם Sara, כמו she, מוסיפים s: goes."}, {"q": "We were hungry, ___ we made some sandwiches.", "o": ["so", "but", "or", "although"], "t": "מילות קישור", "w": "so = לכן. הכנת הכריכים היא התוצאה של הרעב."}, {"q": "The bag was too ___ to carry, so Dan took out a few books.", "o": ["heavy", "empty", "quiet", "cheap"], "t": "אוצר מילים", "w": "heavy = כבד. הוצאת ספרים מפחיתה את משקל התיק."}, {"q": "There ___ three chairs in the kitchen.", "o": ["are", "is", "am", "be"], "t": "זמנים", "w": "three chairs הוא רבים, ולכן there are ולא there is."}, {"q": "I cannot buy this jacket because it is too ___.", "o": ["expensive", "friendly", "early", "clean"], "t": "אוצר מילים", "w": "expensive = יקר. המחיר מסביר מדוע אי אפשר לקנות את המעיל."}, {"q": "This train is ___ than the bus; the journey takes only twenty minutes.", "o": ["faster", "fastest", "fast", "more fast"], "t": "מדרגות השוואה", "w": "משווים רכבת לאוטובוס בעזרת than. צורת ההשוואה היא faster."}, {"q": "Lina took an umbrella ___ it was raining.", "o": ["because", "unless", "although", "before"], "t": "מילות קישור", "w": "because = כי. הגשם הוא הסיבה ללקיחת המטרייה."}, {"q": "The woman ___ teaches us English lives near the school.", "o": ["who", "where", "when", "whose"], "t": "כינויי קישור", "w": "who מחבר לאדם שעושה את הפעולה: האישה שמלמדת אותנו."}, {"q": "The shop is not open on Sundays. It is ___.", "o": ["closed", "crowded", "modern", "bright"], "t": "אוצר מילים", "w": "closed = סגור, ההפך מ-open."}]}, {"id": "rs", "name": "ניסוח מחדש", "en": "Restatement", "intro": "בחרו את המשפט שמשמעותו הקרובה ביותר למשפט המקורי.", "qs": [{"q": "Tom walks to school every morning.", "o": ["Tom goes to school on foot each morning.", "Tom takes a bus to school each morning.", "Tom walks home from school every evening.", "Tom sometimes misses school."], "t": "אוצר מילים", "w": "on foot = ברגל; each morning = every morning. הכיוון וההרגל נשמרים."}, {"q": "The box is too big for this shelf.", "o": ["The box does not fit on this shelf because of its size.", "The box is small enough for this shelf.", "The shelf is too large for the box.", "The box fits perfectly on this shelf."], "t": "מבנים מיוחדים", "w": "too big = גדול מדי. הגודל מונע מהקופסה להתאים למדף."}, {"q": "Emma arrived before Jack.", "o": ["Jack arrived after Emma.", "Jack and Emma arrived together.", "Emma arrived after Jack.", "Emma did not arrive."], "t": "אוצר מילים", "w": "before = לפני, after = אחרי. שינוי סדר השמות מחייב להפוך את מילת הזמן."}, {"q": "You must not eat in this room.", "o": ["Eating in this room is not allowed.", "You have to eat in this room.", "Food is available in this room.", "Eating in this room is a good idea."], "t": "כמתים ושלילה", "w": "must not מציין איסור. not allowed = אסור."}, {"q": "Nora can speak both English and French.", "o": ["Nora is able to speak English as well as French.", "Nora can speak English but not French.", "Nora is learning French instead of English.", "Nora cannot speak either language."], "t": "מבנים מיוחדים", "w": "both ... and ו-as well as מציינים כאן את שתי השפות. can = is able to."}, {"q": "The concert was cancelled because the singer was ill.", "o": ["The singer was ill, so the concert did not take place.", "The singer became ill after the concert.", "The concert took place although the singer was ill.", "The singer cancelled her holiday to perform."], "t": "מילות קישור", "w": "מחלת הזמרת היא הסיבה לביטול. did not take place = לא התקיים."}, {"q": "Only two students finished the task.", "o": ["Two students, and no others, completed the task.", "All students except two completed the task.", "More than two students completed the task.", "No student completed the task."], "t": "כמתים ושלילה", "w": "only two = שניים בלבד. אין להפוך זאת לכולם חוץ משניים."}, {"q": "The room was cleaned by the children.", "o": ["The children cleaned the room.", "The children will clean the room.", "Someone cleaned the children's clothes.", "The children were told to leave the room."], "t": "סביל", "w": "was cleaned by מציין מי ניקה בעבר. בפעיל: The children cleaned."}]}, {"id": "rc", "name": "הבנת הנקרא", "en": "Reading Comprehension", "intro": "קראו כל קטע וענו על השאלות. אפשר לחזור לטקסט בכל שלב.", "passages": [{"title": "A Garden at School", "text": ["A small school had an empty area behind its classrooms. Last spring, a teacher asked the students to turn it into a garden. The students planted tomatoes and carrots. They worked in small groups and watered the plants before lessons.", "At first, some students thought the work would be boring. But when the first vegetables were ready, they were excited. The school cook used the vegetables to make lunch. Now the students want to grow more kinds of food next year."], "qs": [{"q": "What is the text mainly about?", "o": ["Students who created a school garden.", "A cook who opened a new restaurant.", "Students who built new classrooms.", "A teacher who moved to another school."], "t": "רעיון מרכזי", "w": "שתי הפסקאות עוסקות בהקמת הגינה ובמה שקרה בעקבותיה."}, {"q": "Where was the garden?", "o": ["Behind the classrooms.", "Inside the kitchen.", "Next to the teacher's home.", "On the roof of a shop."], "t": "פרט בטקסט", "w": "בתחילת הטקסט כתוב: an empty area behind its classrooms."}, {"q": "How did some students feel at first?", "o": ["They expected the work to be boring.", "They were afraid of the cook.", "They wanted to stop eating vegetables.", "They thought the garden was too small."], "t": "פרט בטקסט", "w": "At first ... thought the work would be boring. חשוב להבחין בין ההתחלה להמשך."}, {"q": "What does \"they\" in \"they were excited\" refer to?", "o": ["The students.", "The vegetables.", "The classrooms.", "The small groups of plants."], "t": "מילה בהקשר", "w": "המתרגשים הם התלמידים שהוזכרו במשפט הקודם, לא הירקות."}]}, {"title": "Repairing Bicycles", "text": ["Every Saturday, a group of volunteers meets in a public park to repair bicycles. People bring broken bicycles, and the volunteers show them how to fix simple problems. There is no charge for the help, but people pay for new parts if they need them.", "The group wants people to learn, not just to get a repair. One visitor, Maya, learned how to change a wheel. The following month, she helped her brother repair his bicycle. The volunteers hope that more visitors will share their new skills with others."], "qs": [{"q": "When does the group meet?", "o": ["Every Saturday.", "Every morning.", "Once a month.", "Only during the summer."], "t": "פרט בטקסט", "w": "המילים Every Saturday מופיעות במשפט הראשון."}, {"q": "What may visitors have to pay for?", "o": ["New parts for their bicycles.", "The volunteers' time.", "Lessons in the park.", "A ticket to enter the park."], "t": "פרט בטקסט", "w": "העזרה חינם, אבל people pay for new parts if they need them."}, {"q": "Why is Maya mentioned?", "o": ["To show that visitors can use their new skills to help others.", "To show that repairing bicycles is always difficult.", "To explain why the group stopped meeting.", "To describe the person who started the group."], "t": "הסקה", "w": "מאיה למדה לתקן ואז עזרה לאחיה. זו דוגמה להעברת הידע, מטרת הקבוצה."}, {"q": "The word \"fix\" is closest in meaning to:", "o": ["repair", "sell", "hide", "borrow"], "t": "מילה בהקשר", "w": "בהקשר של אופניים שבורים, fix פירושו לתקן, כלומר repair."}]}]}], "advanced": [{"id": "sc", "name": "השלמת משפטים", "en": "Sentence Completion", "intro": "בחרו את המילה או הצירוף שמשלימים את המשפט נכון.", "qs": [{"q": "The evidence was too ___ to justify such a firm conclusion.", "o": ["inconclusive", "compelling", "conclusive", "decisive"], "t": "אוצר מילים", "w": "inconclusive = לא חד-משמעי. ראיות כאלה אינן מצדיקות מסקנה נחרצת; שאר האפשרויות מציינות כוח או החלטיות."}, {"q": "The committee approved the proposal, ___ that its cost would not exceed the agreed budget.", "o": ["provided", "whereas", "despite", "notwithstanding"], "t": "מילות קישור", "w": "provided that = בתנאי ש. האישור כפוף לתקרת התקציב. whereas מציין ניגוד ולא תנאי."}, {"q": "Far from ___ the dispute, the announcement gave both sides further reasons to disagree.", "o": ["settling", "provoking", "prolonging", "intensifying"], "t": "אוצר מילים", "w": "Far from settling = רחוק מליישב. ההמשך מתאר שההודעה דווקא הוסיפה סיבות למחלוקת."}, {"q": "Had the warning been issued earlier, the damage ___ considerably less severe.", "o": ["would have been", "will have been", "had been", "would be being"], "t": "משפטי תנאי", "w": "Had the warning been issued = If the warning had been issued. בתנאי דמיוני בעבר משתמשים ב-would have been."}, {"q": "The findings should be interpreted with ___, since the sample was unusually small.", "o": ["caution", "certainty", "indifference", "urgency"], "t": "אוצר מילים", "w": "with caution = בזהירות. מדגם קטן מגביל את הביטחון שאפשר לתת בממצאים."}, {"q": "No sooner had the negotiations resumed ___ another disagreement emerged.", "o": ["than", "when", "that", "until"], "t": "מבנים מיוחדים", "w": "הצירוף הוא no sooner ... than: מיד לאחר שהתחדש המשא ומתן, הופיעה מחלוקת נוספת."}, {"q": "The apparent improvement may be ___ to a change in measurement rather than a genuine rise in quality.", "o": ["attributable", "immune", "opposed", "irrelevant"], "t": "אוצר מילים", "w": "attributable to = נובע מ-, ניתן לייחס ל-. ייתכן שמקור השיפור הוא שיטת המדידה."}, {"q": "___ persuasive the explanation may sound, it does not account for the missing data.", "o": ["However", "Therefore", "Because", "Despite"], "t": "מילות קישור", "w": "However + תואר = לא משנה עד כמה. למרות שההסבר נשמע משכנע, הוא אינו מסביר את הנתונים החסרים."}, {"q": "The policy was intended to ___ inequality, yet it disproportionately benefited wealthy households.", "o": ["alleviate", "exacerbate", "perpetuate", "conceal"], "t": "אוצר מילים", "w": "alleviate = להקל על, לצמצם. yet מסמן ניגוד בין המטרה לצמצם אי-שוויון לבין התוצאה."}, {"q": "The archive contains several letters, the authenticity of ___ remains disputed.", "o": ["which", "whom", "whose", "what"], "t": "כינויי קישור", "w": "הצירוף הוא the authenticity of which. which מתייחס למכתבים, ו-of קושר לאמינותם."}]}, {"id": "rs", "name": "ניסוח מחדש", "en": "Restatement", "intro": "בחרו את המשפט שמשמעותו הקרובה ביותר למשפט המקורי.", "qs": [{"q": "The absence of evidence does not necessarily constitute evidence of absence.", "o": ["Failing to find evidence of something does not by itself prove that it does not exist.", "Anything for which no evidence exists must be imaginary.", "Evidence is unnecessary when something is known to be absent.", "If something exists, evidence of it is always easy to find."], "t": "כמתים ושלילה", "w": "does not necessarily דוחה מסקנה הכרחית. אי-מציאת ראיות אינה הוכחה אוטומטית לאי-קיום."}, {"q": "Only after the results had been independently replicated did the researchers publish their claim.", "o": ["The researchers waited for independent replication of the results before publishing their claim.", "The results were independently replicated only because the claim had been published.", "The researchers published their claim before anyone could replicate the results.", "Independent replication was considered unnecessary before publication."], "t": "מבנים מיוחדים", "w": "Only after קובע סדר: קודם שחזור עצמאי, אחר כך פרסום. אין כאן טענה שהפרסום גרם לשחזור."}, {"q": "The measure is unlikely to succeed unless accompanied by broader reforms.", "o": ["Without broader reforms, the measure probably will not succeed.", "Broader reforms will certainly make the measure successful.", "The measure is expected to succeed even without other reforms.", "The measure cannot succeed under any circumstances."], "t": "משפטי תנאי ו-wish", "w": "unless = if not. הרפורמות מוצגות כתנאי להצלחה סבירה, לא כהבטחה ודאית להצלחה."}, {"q": "Her reluctance to endorse the plan stemmed less from its cost than from doubts about its feasibility.", "o": ["Doubts about whether the plan could work mattered more to her than its cost.", "The plan's cost was her only reason for refusing to endorse it.", "She supported the plan because it was both practical and inexpensive.", "She was more concerned about cost than about whether the plan would work."], "t": "מבנים מיוחדים", "w": "less ... than מציב את היתכנות התוכנית כחשש העיקרי. feasibility = היתכנות."}, {"q": "The discovery challenges, rather than confirms, the prevailing account of how the species evolved.", "o": ["The discovery casts doubt on the widely accepted explanation of the species' evolution.", "The discovery proves that the most popular explanation is correct.", "There has never been an accepted explanation of the species' evolution.", "The discovery explains why the species could not have evolved."], "t": "אוצר מילים", "w": "challenges = מערער; prevailing account = ההסבר המקובל. אין כאן אישור או הפרכה מוחלטת."}, {"q": "Even if the estimate is accurate, it tells us little about how the benefits are distributed.", "o": ["An accurate estimate would still reveal little about who receives the benefits.", "The estimate must be inaccurate because benefits are unequally distributed.", "Knowing the estimate is accurate reveals exactly who benefits.", "The benefits cannot be distributed until the estimate is checked."], "t": "מילות קישור", "w": "Even if = גם אם. דיוק האומדן אינו פותר את השאלה מי מקבל את התועלת."}, {"q": "The decline cannot be attributed solely to changes in consumer preferences.", "o": ["Changes in consumer preferences are not a sufficient explanation on their own for the decline.", "Consumer preferences played no role whatsoever in the decline.", "The decline was caused entirely by changing consumer preferences.", "The decline proves that consumer preferences have not changed."], "t": "כמתים ושלילה", "w": "solely = אך ורק. שלילת הסבר יחיד אינה אומרת שלאותו גורם אין שום השפעה."}, {"q": "Had it not been for the subsidy, the service would have been discontinued.", "o": ["The subsidy prevented the service from being discontinued.", "The service was discontinued despite receiving a subsidy.", "The subsidy was introduced only after the service had ended.", "The service would have continued without any subsidy."], "t": "משפטי תנאי ו-wish", "w": "Had it not been for = אלמלא. הסבסוד הוא שאפשר לשירות להמשיך."}]}, {"id": "rc", "name": "הבנת הנקרא", "en": "Reading Comprehension", "intro": "קראו כל קטע וענו על השאלות. אפשר לחזור לטקסט בכל שלב.", "passages": [{"title": "When a Measure Becomes a Target", "text": ["A city once assessed its public libraries mainly by the number of books they lent. Seeking to improve their ratings, some branches placed popular short books near the entrance and reduced space for specialised collections. Lending rose, but residents researching local history found fewer useful materials. The indicator had not been fabricated; it simply captured a narrower idea of success than the service was meant to pursue.", "This illustrates a recurring problem in public policy. A measure can be informative while it merely describes an activity, yet become less reliable when rewards depend on it. Staff may redirect effort towards whatever is counted, even without intending to mislead anyone. The problem is not confined to dishonest behaviour: sensible responses to incentives can produce an outcome that undermines the original objective.", "Abandoning measurement altogether, however, would make it harder to identify failing services. A more defensible approach combines several indicators with qualitative review and periodically asks what the indicators leave out. Such a system is less convenient than a single ranking, but convenience is not the same as validity."], "qs": [{"q": "Which statement best captures the author's main argument?", "o": ["Performance measures should be used with safeguards because incentives can weaken their value.", "Public services should avoid collecting numerical data altogether.", "Staff usually invent data whenever rewards depend on performance.", "A single ranking is the fairest way to compare public services."], "t": "רעיון מרכזי", "w": "הכותב מזהיר מפני המדדים אך אינו דוחה אותם. הוא מציע כמה מדדים ובדיקה איכותנית."}, {"q": "What does the library example demonstrate?", "o": ["An indicator can improve while an important part of the service deteriorates.", "Short books are generally more valuable than historical materials.", "Lending figures were deliberately falsified by library staff.", "Specialised collections always attract more readers than popular books."], "t": "הסקה", "w": "מספר ההשאלות עלה, אך התמיכה בחקר ההיסטוריה המקומית נפגעה. שיפור במדד אינו בהכרח שיפור כולל."}, {"q": "In paragraph 2, \"undermines\" is closest in meaning to:", "o": ["weakens", "establishes", "clarifies", "measures"], "t": "מילה בהקשר", "w": "undermines the original objective = פוגע במטרה המקורית או מחליש אותה."}, {"q": "Why does the author mention that the indicator \"had not been fabricated\"?", "o": ["To separate the limitations of a measure from deliberate falsification.", "To claim that the lending figure was a complete measure of success.", "To argue that incentives never influence staff behaviour.", "To show that historical materials were still widely available."], "t": "הסקה", "w": "הדגש הוא שהנתון אמיתי ובכל זאת חלקי. הבעיה אינה תלויה בזיוף מכוון."}]}, {"title": "Restoring an Urban River", "text": ["For decades, an urban river ran between concrete walls designed to move storm water rapidly out of the city. When planners proposed replacing parts of those walls with planted banks, supporters predicted cleaner water and richer wildlife. Opponents questioned whether a more natural channel could provide the same protection against flooding. Rather than restore the entire river at once, the city selected two short stretches for a trial.", "After three years, both stretches contained more aquatic species, and water quality had improved slightly. Flood protection was harder to assess: no unusually severe storm had occurred during the trial. A consultant described the ecological results as encouraging but warned that the absence of flooding was not a rigorous test of the new design. Computer models suggested that wider planted areas could retain additional water, though the models depended on assumptions about soil conditions.", "The council approved a limited extension while requiring more monitoring and reserving funds for modifications. Some campaigners called this excessive caution. Yet the decision reflected a distinction between evidence that a project has benefits and evidence that all its risks are acceptable. The trial had strengthened the former case without settling the latter."], "qs": [{"q": "Why was the restoration initially limited to two stretches?", "o": ["The city chose to test the approach before adopting it throughout the river.", "Only two stretches had ever been affected by flooding.", "Planners had already proved that planted banks prevented every flood.", "Opponents wanted the river to be completely covered."], "t": "פרט בטקסט", "w": "בסוף הפסקה הראשונה מתואר trial בשני קטעים במקום שינוי של כל הנהר בבת אחת."}, {"q": "Why was the absence of flooding insufficient evidence of safety?", "o": ["The trial had not included an unusually severe storm.", "The water quality had become worse during the trial.", "The river contained fewer species than before.", "The concrete walls had never been removed."], "t": "הסקה", "w": "בלי סופה חריגה, ההגנה מפני אירוע קיצוני לא באמת נבחנה. אין להסיק ביטחון רק מכך שלא היה שיטפון."}, {"q": "What does \"the latter\" in the final sentence refer to?", "o": ["The case that all the project's risks are acceptable.", "The claim that the project has ecological benefits.", "The campaigners' demand to stop the trial immediately.", "The funds reserved for modifications."], "t": "מילה בהקשר", "w": "former ו-latter מתייחסים לשתי הטענות במשפט הקודם: תועלות ראשונה, קבילות הסיכונים שנייה."}, {"q": "Which best describes the author's attitude to the council's decision?", "o": ["The author presents the cautious extension as consistent with the remaining uncertainty.", "The author condemns the decision as proof that restoration has failed.", "The author argues that computer models have eliminated all uncertainty.", "The author claims that ecological benefits make flood risks irrelevant."], "t": "הסקה", "w": "הסיום מסביר את ההבחנה בין הוכחת תועלת לבירור סיכון, ולכן מצדיק את הזהירות מול אי-הוודאות שנותרה."}]}]}]};

    else s.qs.forEach(function(q){list.push({q:q})});
    list.forEach(function(x){
      items.push({sec:si,q:x.q.q,t:x.q.t,w:x.q.w,passage:x.p||null,
        opts:shuffle(x.q.o.map(function(txt,i){return {txt:txt,ok:i===0}})),pick:-1});
    });
  });
  state={items:items,i:0,shown:{}};
}
function start(){
  SECTIONS=LEVEL_DATA[level];
  app.innerHTML='<h1>אימון אנגלית בסגנון אמירנט</h1>'+
  '<div class="note"><b>כלי תרגול עצמאי, לא מבחן רשמי.</b> הרמות נועדו לאימון בלבד. אין כאן מבחן אדפטיבי, ציון אמירנט או קביעה רשמית של רמת אנגלית.</div>'+
  '<div class="card"><h2>באיזו רמה מתרגלים?</h2><div class="levels" role="group" aria-label="בחירת רמה">'+Object.keys(LEVELS).map(function(k){var l=LEVELS[k];return '<button class="level '+(level===k?'selected':'')+'" aria-pressed="'+(level===k)+'" data-level="'+k+'"><strong>'+l.name+'</strong> <bdi dir="ltr" lang="en">'+l.hint+'</bdi><small>'+l.desc+'</small></button>'}).join('')+'</div><small style="color:var(--mute)">סימוני הרמה הם הערכה כללית בלבד, לא כיול או המרה לציון רשמי. בכל רמה סט נפרד של שאלות מקוריות.</small></div>'+
  '<div class="card"><h2>מה יש ברמה '+LEVELS[level].name+'?</h2><ul class="clean">'+
  SECTIONS.map(function(s){var n=s.passages?s.passages.reduce(function(a,p){return a+p.qs.length},0):s.qs.length;return '<li><b>'+s.name+'</b> · '+n+' שאלות<span class="section-en" lang="en">'+s.en+'</span></li>'}).join('')+
  '</ul><p>26 שאלות בכל רמה: 10 השלמת משפטים, 8 ניסוח מחדש ו-8 הבנת הנקרא בשני קטעים. אין שעון, קחו את הזמן.</p><p style="margin-bottom:0">בסוף: ציון לפי חלקים, הסברים ומה כדאי לחזק. התוצאה נשארת רק בניסיון הנוכחי ואינה נשלחת או נשמרת בשרת.</p></div>'+
  '<button class="btn" style="width:100%" id="go">מתחילים ברמה '+LEVELS[level].name+'</button>'+
  '<div class="foot">לא בטוחים? התחילו בבינונית ושנו רמה לפי ההרגשה. ציון גבוה ברמה אחת אינו שקול לציון גבוה ברמה אחרת.</div>';
  app.querySelectorAll('[data-level]').forEach(function(btn){btn.onclick=function(){level=btn.dataset.level;start()}});
  document.getElementById("go").onclick=function(){build();render();window.scrollTo(0,0)};
}
function render(){
  var it=state.items[state.i],n=state.items.length,s=SECTIONS[it.sec];
  var firstOfSec=state.i===0||state.items[state.i-1].sec!==it.sec;
  var h='<div class="meta"><span>'+LEVELS[level].name+' · '+s.name+'</span><bdi dir="ltr">'+(state.i+1)+' / '+n+'</bdi></div><div class="prog"><i style="width:'+(state.i/n*100)+'%"></i></div>';
  if(firstOfSec)h+='<div class="card" style="margin:10px 0"><h2>'+s.name+' <span class="en" style="display:inline;font-size:.9rem;color:var(--mute)">'+s.en+'</span></h2><div>'+s.intro+'</div></div>';
  h+='<div class="card">';
  if(it.passage){h+='<div class="passage en"><div class="ptitle">'+esc(it.passage.title)+'</div>'+it.passage.text.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>'}
  h+='<p class="q en">'+esc(it.q)+'</p>';
  it.opts.forEach(function(o,k){h+='<button class="opt'+(it.pick===k?' sel':'')+'" data-k="'+k+'"><b>'+LET[k]+'</b><span>'+esc(o.txt)+'</span></button>'});
  h+='</div><div class="row"><button class="btn sec" id="prev"'+(state.i===0?' disabled':'')+'>הקודם</button><button class="btn" id="next"'+(it.pick<0?' disabled':'')+'>'+(state.i===n-1?'סיום וציון':'הבא')+'</button></div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){it.pick=+b.dataset.k;render()}});
  document.getElementById("prev").onclick=function(){state.i--;render();window.scrollTo(0,0)};
  document.getElementById("next").onclick=function(){if(state.i===n-1)results();else{state.i++;render();window.scrollTo(0,0)}};
}
function results(){
  var items=state.items,tot=0,per=SECTIONS.map(function(){return {c:0,n:0}}),tags={};
  items.forEach(function(it){
    var ok=it.pick>=0&&it.opts[it.pick].ok;it.ok=ok;
    per[it.sec].n++;if(ok){per[it.sec].c++;tot++}else{tags[it.t]=(tags[it.t]||0)+1}
  });
  var pct=Math.round(tot/items.length*100);
  var verdict=pct>=85?"תוצאה חזקה ברמה שנבחרה. עברו על הטעויות הבודדות; אם קיימת רמה גבוהה יותר, אפשר לנסות אותה.":pct>=65?"בסיס טוב. יש כמה נושאים ספציפיים שכדאי לחזק, הם ברשימה למטה.":pct>=45?"יש על מה לעבוד, וזה בסדר. התחילו מהנושאים הראשונים ברשימה ותרגלו שוב.":"זה רק תרגול ראשון. התחילו מהבסיס ברשימה למטה, ותנסו שוב בעוד כמה ימים.";
  var h='<h1>התוצאה שלך · רמה '+LEVELS[level].name+'</h1><div class="card"><div class="big"><bdi dir="ltr">'+tot+' / '+items.length+'</bdi></div><div style="color:var(--mute)">'+pct+'% תשובות נכונות</div><p style="margin:8px 0 0">'+verdict+'</p></div>';
  h+='<div class="card"><h2>לפי חלקים</h2>'+SECTIONS.map(function(s,i){var p=per[i];return '<div class="sec-line"><span>'+s.name+'</span><b><bdi dir="ltr">'+p.c+' / '+p.n+'</bdi></b></div><div class="bar"><i style="width:'+(p.c/p.n*100)+'%"></i></div>'}).join('')+'</div>';
  var tk=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a]});
  h+='<div class="card"><h2>מה כדאי לתרגל</h2>';
  if(!tk.length)h+='<p>לא היו טעויות. כל הכבוד! לתרגול נוסף אפשר ללמוד מילים חדשות ולקרוא טקסטים ארוכים יותר.</p>';
  else h+=tk.map(function(t){return '<div class="prac"><b>'+t+'</b> <small>'+tags[t]+' '+(tags[t]===1?'טעות':'טעויות')+'</small>'+ltr(TIPS[t]||'')+'</div>'}).join('');
  h+='</div>';
  h+='<div class="card"><h2>הסבר לכל שאלה</h2><div class="row" style="margin:0 0 6px"><button class="btn sec" id="fAll">הכל</button><button class="btn sec" id="fBad">רק טעויות</button></div><div id="rev"></div></div>';
  h+='<div class="row"><button class="btn" id="again">שוב באותה רמה</button><button class="btn sec" id="choose">בחירת רמה אחרת</button></div><p style="color:var(--mute);font-size:.9rem">בתרגול חוזר השאלות זהות וסדר התשובות מתערבב. שיפור אחרי חזרה אינו בהכרח שיפור ברמת האנגלית.</p>';
  h+='<div class="foot">כלי אימון בלבד. הציון הוא אחוז התשובות הנכונות ברמה שנבחרה, לא ציון אמירנט ולא תחליף להכנה מסודרת.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
  function rev(onlyBad){
    var out='';
    items.forEach(function(it,i){
      if(onlyBad&&it.ok)return;
      var right=it.opts.filter(function(o){return o.ok})[0].txt;
      out+='<div class="rev"><span class="chip">'+SECTIONS[it.sec].name+'</span><span class="chip">'+it.t+'</span> <span class="'+(it.ok?'tag-ok':'tag-bad')+'">'+(it.ok?'נכון':(it.pick<0?'לא נענתה':'לא נכון'))+'</span>'+
      '<p class="q en" style="margin-top:8px">'+(i+1)+'. '+esc(it.q)+'</p>'+
      (it.ok?'':'<div class="en" style="color:var(--bad)">Your answer: '+(it.pick<0?'-':esc(it.opts[it.pick].txt))+'</div>')+
      '<div class="en" style="color:var(--ok)">Correct: '+esc(right)+'</div><div class="why">'+ltr(it.w)+'</div></div>';
    });
    if(!out)out='<p>אין טעויות להצגה.</p>';
    document.getElementById("rev").innerHTML=out;
  }
  rev(true);
  document.getElementById("choose").onclick=function(){start();window.scrollTo(0,0)};
  document.getElementById("fAll").onclick=function(){rev(false)};
  document.getElementById("fBad").onclick=function(){rev(true)};
  document.getElementById("again").onclick=function(){build();render();window.scrollTo(0,0)};
}
start();
</script>
</body>
</html>
